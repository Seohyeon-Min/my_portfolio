<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vine Effect Prototype</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #f4f2ec;
    overflow: hidden;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    z-index: 1;
  }

  /* No shared `svg path` rule here: the mask's centerline path is a stroke
     (fill:none) and the visible ribbons are fills (stroke:none), so each
     sets its own fill/stroke inline rather than sharing one CSS rule --
     a stylesheet rule would otherwise always win over the presentation
     attributes set from JS. No vector-effect:non-scaling-stroke on the
     mask stroke either: at large slice-crop scale factors it desyncs the
     dash pattern and leaks part of the "hidden" tail. */

  .label {
    position: absolute;
    top: 1.5rem;
    left: 1.5rem;
    z-index: 2;
    font-family: system-ui, sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(23, 27, 45, 0.4);
  }

  /* ---------- 5 variant buttons, inside the stage ---------- */
  .variant-bar {
    position: absolute;
    left: 50%;
    bottom: 2.5rem;
    transform: translateX(-50%);
    z-index: 2;
    display: flex;
    gap: 0.6rem;
    padding: 0.5rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(6px);
    box-shadow: 0 0.8rem 2rem rgba(23, 27, 45, 0.12);
  }

  .variant-btn {
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: 1px solid rgba(23, 27, 45, 0.18);
    background: #fff;
    color: #171b2d;
    font-family: system-ui, sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.18s ease, color 0.18s ease, border-color 0.18s ease, transform 0.15s ease;
  }

  .variant-btn:hover {
    border-color: #8a6ef0;
    transform: translateY(-1px);
  }

  .variant-btn.is-active {
    background: #8a6ef0;
    border-color: #8a6ef0;
    color: #fff;
  }
</style>
</head>
<body>
  <div class="stage">
    <p class="label">Vine effect &mdash; thin purple line, unbalanced, 5 placements</p>

    <!--
      Fixed coordinate space (1000x700), preserveAspectRatio="xMidYMid slice"
      so the ribbon's own proportions hold on resize -- a differently-shaped
      window just reveals a different portion of the same fixed shape.
      Each variant below is its own set of paths in this same space.
    -->
    <svg id="vine-svg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice"></svg>

    <div class="variant-bar" role="tablist"></div>
  </div>

  <script>
    (function () {
      var svgNS = 'http://www.w3.org/2000/svg';
      var svg = document.getElementById('vine-svg');
      var bar = document.querySelector('.variant-bar');

      // All shapes are deliberately unbalanced -- no mirrored curves, no
      // evenly-spaced waves, loop sizes differ from one side to the other.
      var VARIANTS = [
        {
          label: '1',
          title: 'Lush / center, unbalanced',
          paths: [
            'M 780,-60 C 940,30 1000,170 900,300 C 800,430 960,450 880,570 ' +
            'C 790,700 580,660 440,610 C 300,560 330,450 190,470 ' +
            'C 40,490 20,630 -80,560 C -170,500 -100,370 30,330 ' +
            'C 160,290 110,160 40,80 C -20,10 -100,-30 -190,-100'
          ]
        },
        {
          label: '2',
          title: 'Top-left corner',
          paths: [
            'M -150,-100 C 40,-30 -20,150 160,180 C 340,210 280,30 450,0 ' +
            'C 580,-22 560,110 690,90 C 780,76 760,-40 620,-90'
          ]
        },
        {
          label: '3',
          title: 'Top-right corner',
          paths: [
            'M 1150,-100 C 960,-10 1040,180 860,190 C 700,198 760,40 590,60 ' +
            'C 460,76 500,190 360,150 C 260,120 300,10 200,-60 ' +
            'C 140,-100 70,-90 -40,-120'
          ]
        },
        {
          label: '4',
          title: 'Bottom-left corner',
          paths: [
            'M -100,530 C 60,470 10,620 150,600 C 280,580 260,500 380,490 ' +
            'C 460,483 430,560 500,640'
          ]
        },
        {
          label: '5',
          title: 'Two lines, one near the top, one near the bottom',
          paths: [
            'M -100,110 C 40,80 30,160 170,140 C 320,118 300,-60 460,-90 ' +
            'C 620,-115 700,20 780,10 C 860,0 900,-40 1000,-60',
            'M 0,700 C 120,680 140,560 280,540 C 400,525 460,660 550,690 ' +
            'C 650,715 720,560 850,520 C 950,500 1050,460 1150,430'
          ]
        }
      ];

      var buttons = [];
      var activeIndex = 0;

      function buildButton(variant, index) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'variant-btn';
        btn.textContent = variant.label;
        btn.title = variant.title;
        btn.addEventListener('click', function () { selectVariant(index); });
        bar.appendChild(btn);
        buttons.push(btn);
      }

      // Each vine is a small bundle of parallel strands (a thicker core +
      // thinner offset companions) instead of one flat stroke -- that's
      // what reads as a woven/braided line. The offsets are a fixed pixel
      // nudge (not a true parallel-curve offset), so strands fan apart a
      // little more at sharp bends, which looks organic rather than
      // mechanically parallel.
      //
      // Width varies *continuously* along each strand: SVG can't vary
      // stroke-width along one stroked path, so instead each strand is
      // built as a single FILLED shape -- sample many points along the
      // curve, give each one a width smoothly interpolated from
      // WIDTH_PROFILE (smoothstep, not a hard step), offset left/right by
      // that width along the local normal, and stitch the two offset rails
      // into one closed polygon. That's one continuous outline with no
      // internal seams, so it swells and pinches smoothly instead of
      // looking like separate joined-up pieces.
      //
      // Growing it in still uses the proven dash-offset trick, just via a
      // <mask>: a plain stroked centerline (thick enough to always cover
      // the ribbon) animates stroke-dashoffset the normal way, and the
      // filled ribbon shapes are masked by it -- so the reveal follows the
      // curve exactly while the visible shape stays the smooth taper.
      var WIDTH_PROFILE = [3, 22, 6, 26, 4, 20, 3, 16];
      var STRANDS = [
        { dx: 0, dy: 0, opacity: 1, color: '#7c5cff', scale: 1 },
        { dx: 9, dy: 7, opacity: 0.6, color: '#8a6ef0', scale: 0.45 },
        { dx: -7, dy: -9, opacity: 0.4, color: '#a394f5', scale: 0.25 }
      ];
      var SAMPLE_COUNT = 90;
      var MASK_STROKE_WIDTH = 70; // must exceed max strand offset + max width

      function smoothstep(t) { return t * t * (3 - 2 * t); }

      function widthAt(t) {
        var kf = WIDTH_PROFILE;
        var kt = t * (kf.length - 1);
        var k0 = Math.floor(kt);
        var k1 = Math.min(kf.length - 1, k0 + 1);
        var w = kf[k0] + (kf[k1] - kf[k0]) * smoothstep(kt - k0);
        var edgeTaper = Math.min(1, t / 0.035, (1 - t) / 0.035); // taper to a point at both tips
        return Math.max(0, w) * Math.max(0, edgeTaper);
      }

      function buildRibbonPath(centerPts, dx, dy, widthScale) {
        var left = [];
        var right = [];
        for (var i = 0; i < centerPts.length; i++) {
          var p = centerPts[i];
          var half = (p.w * widthScale) / 2;
          left.push((p.x + dx + p.nx * half).toFixed(2) + ',' + (p.y + dy + p.ny * half).toFixed(2));
          right.push((p.x + dx - p.nx * half).toFixed(2) + ',' + (p.y + dy - p.ny * half).toFixed(2));
        }
        right.reverse();
        var path = document.createElementNS(svgNS, 'path');
        path.setAttribute('d', 'M ' + left.join(' L ') + ' L ' + right.join(' L ') + ' Z');
        return path;
      }

      function selectVariant(index) {
        activeIndex = index;
        buttons.forEach(function (btn, i) { btn.classList.toggle('is-active', i === index); });

        svg.innerHTML = '';
        var defs = document.createElementNS(svgNS, 'defs');
        svg.appendChild(defs);

        VARIANTS[index].paths.forEach(function (d, groupIndex) {
          // Measure the base (untransformed) curve once: sample points,
          // local tangent/normal, and width at each -- shared by every
          // strand of this vine (strands only differ by dx/dy/scale).
          var measure = document.createElementNS(svgNS, 'path');
          measure.setAttribute('d', d);
          measure.style.visibility = 'hidden';
          svg.appendChild(measure);
          var totalLength = measure.getTotalLength();

          var centerPts = [];
          for (var i = 0; i <= SAMPLE_COUNT; i++) {
            var t = i / SAMPLE_COUNT;
            var pt = measure.getPointAtLength(t * totalLength);
            centerPts.push({ x: pt.x, y: pt.y, t: t });
          }
          for (i = 0; i <= SAMPLE_COUNT; i++) {
            var prev = centerPts[Math.max(0, i - 1)];
            var next = centerPts[Math.min(SAMPLE_COUNT, i + 1)];
            var tx = next.x - prev.x;
            var ty = next.y - prev.y;
            var tl = Math.hypot(tx, ty) || 1;
            centerPts[i].nx = -ty / tl;
            centerPts[i].ny = tx / tl;
            centerPts[i].w = widthAt(centerPts[i].t);
          }
          svg.removeChild(measure);

          // Reveal mask: a thick stroked copy of the same centerline,
          // dash-animated the usual way (full length -> hidden, then
          // animated down to 0). Everything under its painted stroke is
          // visible; everything else (unrevealed curve, and space off the
          // curve) is masked out.
          var maskId = 'vine-mask-' + index + '-' + groupIndex;
          var mask = document.createElementNS(svgNS, 'mask');
          mask.setAttribute('id', maskId);
          mask.setAttribute('maskUnits', 'userSpaceOnUse');
          var maskPath = document.createElementNS(svgNS, 'path');
          maskPath.setAttribute('d', d);
          maskPath.setAttribute('fill', 'none');
          maskPath.setAttribute('stroke', '#fff');
          maskPath.setAttribute('stroke-width', String(MASK_STROKE_WIDTH));
          maskPath.setAttribute('stroke-linecap', 'round');
          maskPath.setAttribute('stroke-linejoin', 'round');
          mask.appendChild(maskPath);
          defs.appendChild(mask);

          var g = document.createElementNS(svgNS, 'g');
          g.setAttribute('mask', 'url(#' + maskId + ')');
          svg.appendChild(g);

          STRANDS.forEach(function (strand) {
            var ribbon = buildRibbonPath(centerPts, strand.dx, strand.dy, strand.scale);
            ribbon.setAttribute('fill', strand.color);
            ribbon.setAttribute('stroke', 'none');
            ribbon.setAttribute('opacity', String(strand.opacity));
            g.appendChild(ribbon);
          });

          // Grow this vine's mask in from hidden. Separate vines (groups,
          // e.g. variant 5's two lines) are staggered against each other.
          maskPath.style.strokeDasharray = String(totalLength);
          maskPath.style.transition = 'none';
          maskPath.style.strokeDashoffset = String(totalLength);
          // Force a reflow so the "hidden" dashoffset is registered before
          // the transition is re-enabled and animated down to 0.
          // eslint-disable-next-line no-unused-expressions
          maskPath.getBoundingClientRect();
          var delay = groupIndex * 500;
          setTimeout(function () {
            requestAnimationFrame(function () {
              maskPath.style.transition = 'stroke-dashoffset 2.4s cubic-bezier(0.65, 0, 0.35, 1)';
              maskPath.style.strokeDashoffset = '0';
            });
          }, delay);
        });
      }

      VARIANTS.forEach(buildButton);
      selectVariant(0);
    })();
  </script>
</body>
</html>
